name: Release

# Builds a self-contained win-x64 publish, packages it into a Windows installer with Inno Setup, and
# a signed Android APK (build-android job below) - both (for an actual version tag push) get attached
# to the same GitHub Release. Manual runs via workflow_dispatch just produce downloadable build
# artifacts, without publishing a public release - handy for testing changes to this workflow or the
# installer script itself.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to stamp into this build, e.g. 1.0.0 (manual runs only)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BitMagic.BennyBox.Desktop.slnf

      - name: Test
        run: dotnet test BitMagic.BennyBox.Desktop.slnf --configuration Release

      - name: Publish self-contained win-x64
        # TMDB_API_KEY_ENCODED must already be obfuscated (EmbeddedKeyObfuscator.Obfuscate, see
        # BitMagic.BennyBox.Sources/Tmdb) before it's stored as a repo secret - never store a raw
        # TMDb API key here. Absent/empty on any build that doesn't have this secret configured
        # (e.g. a fork), which is fine - see BitMagic.BennyBox.Sources.csproj and
        # EmbeddedTmdbApiKey.cs for what happens then (falls back to Settings-only, same as a local
        # dev build).
        env:
          TMDB_API_KEY_ENCODED: ${{ secrets.TMDB_API_KEY_ENCODED }}
        run: >
          dotnet publish src/BitMagic.BennyBox/BitMagic.BennyBox.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          -p:FileVersion=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}
          --output publish/win-x64

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: >
          iscc
          /DMyAppVersion=${{ steps.version.outputs.version }}
          /DSourceDir="${{ github.workspace }}\publish\win-x64"
          installer\BennyBox.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BennyBoxSetup-${{ steps.version.outputs.version }}
          path: installer-output/*.exe

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/*.exe
          generate_release_notes: true

  build-android:
    # Separate job/runner from build-installer (Android needs the workload the Windows job doesn't
    # install, same split as ci.yml/android-ci.yml) - both jobs independently attach their own files
    # to the same tag's GitHub Release via softprops/action-gh-release, which is safe to call from
    # multiple jobs since it updates an existing release for the tag rather than erroring if one
    # already exists.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # versionCode must be a plain increasing integer (Android refuses to install an update
          # whose versionCode isn't higher than what's already on the device) - major.minor.patch
          # packed as major*10000+minor*100+patch is a common convention that comfortably covers a
          # 0-99 range for minor/patch. Falls back to 1 if the version string doesn't parse as
          # three dot-separated numbers (e.g. a workflow_dispatch typo) rather than failing the build.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "versioncode=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          else
            echo "versioncode=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Decode release keystore
        # Persistent signing key (see ANDROID_KEYSTORE_BASE64 etc. below) - every release from here on
        # is signed with the same key, so Android treats them as updates to install in place rather
        # than a different app each time. Only decoded into $RUNNER_TEMP, which is wiped with the rest
        # of the ephemeral runner at the end of the job - never written into the checked-out repo.
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bennybox-release.keystore"

      - name: Publish Android APK
        # TMDB_API_KEY_ENCODED: same secret as the Windows installer build - see its own comment above
        # and BitMagic.BennyBox.Sources.csproj (the embedding is shared, platform-agnostic MSBuild
        # logic, not something each head project wires up separately).
        #
        # AndroidSigningKeyStore/-KeyAlias/-KeyPass/-StorePass sign with the persistent keystore decoded
        # above instead of the ephemeral debug keystore .NET for Android would otherwise auto-generate -
        # the whole point being that every release uses the *same* key, so Android accepts each new one
        # as an update to the last rather than refusing to install over a different signer. Note this
        # only takes effect from this release onward: anyone with an older release installed (signed
        # with a prior run's own ephemeral debug key) still needs to uninstall that one first - after
        # that, updates install in place with no data loss.
        env:
          TMDB_API_KEY_ENCODED: ${{ secrets.TMDB_API_KEY_ENCODED }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          dotnet publish src/BitMagic.BennyBox.Android/BitMagic.BennyBox.Android.csproj
          --configuration Release
          -p:ApplicationVersion=${{ steps.version.outputs.versioncode }}
          -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }}
          -p:AndroidKeyStore=true
          "-p:AndroidSigningKeyStore=$RUNNER_TEMP/bennybox-release.keystore"
          "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
          "-p:AndroidSigningKeyPass=$ANDROID_KEY_PASSWORD"
          "-p:AndroidSigningStorePass=$ANDROID_KEYSTORE_PASSWORD"
          --output publish/android

      - name: Collect signed APK
        shell: bash
        run: |
          mkdir -p apk-output
          cp publish/android/*-Signed.apk "apk-output/BennyBox-${{ steps.version.outputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BennyBox-${{ steps.version.outputs.version }}-android
          path: apk-output/*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
