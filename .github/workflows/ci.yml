name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # The desktop head (BitMagic.BennyBox) is Windows-only (DPAPI-backed CredentialProtector), so a
    # Windows runner is required here, not just preferred. Scoped to
    # BitMagic.BennyBox.Desktop.slnf (excludes BitMagic.BennyBox.Android) rather than the full .slnx -
    # the Android project needs the android workload/SDK, which this job doesn't install; see
    # android-ci.yml for that build.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore BitMagic.BennyBox.Desktop.slnf

      - name: Build
        run: dotnet build BitMagic.BennyBox.Desktop.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test BitMagic.BennyBox.Desktop.slnf --configuration Release --no-build --logger "console;verbosity=normal"
